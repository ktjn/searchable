name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel one that's already
# publishing partway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter showcase build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: showcase/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Deliberately no `environment: github-pages` block here (unlike
    # GitHub's official template): deployment Environments with
    # protection rules are a paid-plan feature for *private*
    # repositories, and declaring one on a private repo without that
    # plan makes this job get rejected before a runner is even
    # assigned (instant "failure", no steps, runner_id 0) rather than
    # failing on an actual step. actions/deploy-pages doesn't require
    # the job to be tied to an Environment to work — that's purely an
    # optional GitHub UI convention for surfacing the deployment URL.
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
