name: Deploy showcase to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Only one Pages deployment at a time; don't cancel one that's already
# publishing partway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-python
      - name: Set up searchable-indexer (Python, needed to build the showcase's search index)
        working-directory: python/searchable-indexer
        run: uv sync
      - run: pnpm docs:build
      - run: pnpm --filter showcase validate
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: showcase/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Deliberately no `environment: github-pages` block: deployment
    # Environments with protection rules are unavailable for this private
    # repository's plan, and actions/deploy-pages does not require one.
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
