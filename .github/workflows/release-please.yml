name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Open / update the release PR
        uses: googleapis/release-please-action@v2
        with:
          command: release-pr
          token: ${{ secrets.GITHUB_TOKEN }}
          default-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Release-please bumps the workspace, Python, and test-file versions and
      # keeps a single "release" PR open on main. It deliberately does NOT tag:
      # the annotated v<version> tag (which triggers .github/workflows/publish.yml)
      # is created manually from the merged release PR.
