name: Renovate
on:
  # Run once a week. Renovate has no schedule of its own, so every run creates
  # any pending update branches/PRs instead of waiting for dashboard approval.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.14
        with:
          configurationFile: .github/renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: debug
