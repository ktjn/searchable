name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - run: pnpm lint

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - name: Install, lint, typecheck, and test searchable-binary (Python)
        working-directory: python/searchable-binary
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest -v
      - name: Install, lint, typecheck, and test searchable-analysis (Python)
        working-directory: python/searchable-analysis
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest -v
      - name: Install, lint, typecheck, and test searchable-indexer (Python)
        working-directory: python/searchable-indexer
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest -v
      - name: Install, lint, typecheck, and test searchable-client (Python)
        working-directory: python/searchable-client
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest -v

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-python
        with:
          working-directory: python/searchable-indexer
      - name: Build packages once (typecheck/size/test reuse the same build)
        run: pnpm build
      - run: pnpm typecheck
      - run: pnpm size
      - run: pnpm test

  test-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-python
        with:
          working-directory: python/searchable-indexer
      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
      # A cache hit restores the browser binary but not the runner's apt-level
      # OS dependencies, so only the browser download is skippable.
      - name: Install Playwright browser + OS dependencies (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright OS dependencies only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Build packages + showcase once
        run: pnpm build && pnpm --filter showcase build
      - run: pnpm test:browser
