name: CI

# Build-only verification. Tests run locally through scripts/gate.sh, which
# the pre-push hook (.githooks/pre-push) enforces before every push.

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-python
        with:
          working-directory: python/searchable
      - run: pnpm lint
      - name: Build packages + showcase
        run: |
          pnpm build
          pnpm --filter showcase build
      - run: pnpm typecheck
      - name: Build Python package
        run: uv build --project python/searchable
      - name: Validate system specification
        run: |
          pip install system-spec-ref==0.2.0
          system-spec spec/system.yaml --stage release
          system-spec spec/system.yaml --stage release --check-artifacts --root .
      - name: System specification drift (informational)
        # --check-drift flags our term-shard/doc-store-shard/pins-shard JSON
        # Schemas as drift because they're keyed maps (propertyNames +
        # additionalProperties), not fixed `properties` objects; the
        # checker only diffs top-level `properties`. See spec/INTAKE.md.
        continue-on-error: true
        run: |
          system-spec spec/system.yaml --check-drift --root .
