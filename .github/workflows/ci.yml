name: CI

# Build-only verification. Tests run locally through scripts/gate.sh, which
# the pre-push hook (.githooks/pre-push) enforces before every push.

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-python
        with:
          working-directory: python/searchable
      - run: pnpm lint
      - name: Build packages + showcase
        run: |
          pnpm build
          pnpm --filter showcase build
      - run: pnpm typecheck
      - name: Build Python package
        run: uv build --project python/searchable
