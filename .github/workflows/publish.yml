name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# Manual fallback for when a tag push itself doesn't trigger this workflow
# (see docs/project/release-process.md — this has happened even when tagging
# used a PAT specifically to dodge GITHUB_TOKEN's push-event suppression).
# To recover: run this workflow manually against the existing tag, e.g.
#   gh workflow run publish.yml --ref v2.0.1
# `--ref` sets `github.ref`/`github.ref_name` to the tag, so every step below
# (checkout, release notes, package builds) behaves exactly as it would for a
# real tag-push trigger — no separate input or resolution step needed.

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      run-all: true

  release:
    name: Create GitHub release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "See the [changelog](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md#readme)."
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - name: Configure GitHub Packages publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@ktjn'
      - name: Build npm packages
        run: pnpm build
      - name: Publish npm package to GitHub Packages
        run: |
          pnpm --filter @ktjn/searchable publish --access public --no-git-checks

  publish-python:
    needs: checks
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - name: Build Python package
        shell: bash
        run: |
          uv build --project python/searchable
      - name: Collect Python distributions
        shell: bash
        run: |
          mkdir -p dist
          cp python/searchable/dist/* dist/
      - name: Smoke test release artifacts in an isolated environment
        shell: bash
        run: |
          set -euo pipefail

          uv venv /tmp/searchable-release-smoke

          uv pip install \
            --python /tmp/searchable-release-smoke/bin/python \
            --no-index \
            --find-links dist \
            searchable
          # C-extension library that is not part of the searchable release set.
          # Stage that one external runtime dependency from PyPI, then install the
          # indexer offline from dist/ to prove every *searchable* dependency it
          # declares resolves from these built artifacts.
          uv pip install --python /tmp/searchable-release-smoke/bin/python selectolax
          uv pip install \
            --python /tmp/searchable-release-smoke/bin/python \
            --no-index \
            --find-links dist \
            searchable

          /tmp/searchable-release-smoke/bin/python -c \
            "import searchable"

          # Minimal index-build + client-read scenario against a fresh HTML doc.
          WORKDIR=$(mktemp -d)
          mkdir -p "$WORKDIR/docs"
          cat > "$WORKDIR/docs/index.html" <<'EOF'
          <!doctype html>
          <html lang="en">
            <head><title>Widgets</title>
              <meta name="description" content="Everything about widgets."></head>
            <body><main><p>Our widgets are wonderful. Buy widgets today.</p></main></body>
          </html>
          EOF
          /tmp/searchable-release-smoke/bin/searchable \
            "$WORKDIR/docs" "$WORKDIR/index"
          /tmp/searchable-release-smoke/bin/searchable search \
            "$WORKDIR/index/manifest.json" widgets --json \
            | /tmp/searchable-release-smoke/bin/python -c \
              "import json, sys; data = json.load(sys.stdin); assert data['totalHits'] == 1, data; assert data['hits'][0]['fields']['title'] == 'Widgets', data; print('release artifact smoke test: ok')"
      - name: Publish Python packages to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

