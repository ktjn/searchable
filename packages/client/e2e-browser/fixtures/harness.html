<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>searchable worker test harness</title></head>
  <body>
    <script type="module">
      import {
        InvalidManifestError,
        registerOfflineCaching,
        SearchClient,
        VectorProviderMismatchError,
        VectorSearchNotConfiguredError,
      } from "./index.js";

      window.__csfRunSearch = async (query, useWorker, options) => {
        const client = new SearchClient({
          indexUrl: "./manifest.json",
          worker: useWorker,
          workerUrl: useWorker ? new URL("./worker.js", location.href) : undefined,
        });
        return client.search(query, options);
      };

      window.__csfRunFacetValues = async (field, useWorker) => {
        const client = new SearchClient({
          indexUrl: "./manifest.json",
          worker: useWorker,
          workerUrl: useWorker ? new URL("./worker.js", location.href) : undefined,
        });
        return client.facetValues(field);
      };

      window.__csfRunSearchWithEvents = async (query, useWorker) => {
        const client = new SearchClient({
          indexUrl: "./manifest.json",
          worker: useWorker,
          workerUrl: useWorker ? new URL("./worker.js", location.href) : undefined,
        });
        const events = [];
        client.on("query", (payload) => events.push({ type: "query", payload }));
        client.on("result", (payload) =>
          events.push({
            type: "result",
            payload: { query: payload.query, options: payload.options },
          }),
        );
        await client.search(query);
        return events;
      };

      async function rejectionOf(promise) {
        try {
          await promise;
          return undefined;
        } catch (err) {
          return err instanceof Error ? err.message : String(err);
        }
      }

      window.__csfTestDisposeRejectsInFlight = async () => {
        const client = new SearchClient({
          indexUrl: "./manifest.json",
          worker: true,
          workerUrl: new URL("./worker.js", location.href),
        });
        await client.ready();
        const pending = client.search("widgets");
        client.dispose();
        return rejectionOf(pending);
      };

      window.__csfTestSearchAfterDispose = async () => {
        const client = new SearchClient({
          indexUrl: "./manifest.json",
          worker: true,
          workerUrl: new URL("./worker.js", location.href),
        });
        await client.ready();
        client.dispose();
        return rejectionOf(client.search("widgets"));
      };

      window.__csfTestWorkerFatalError = async () => {
        const client = new SearchClient({
          indexUrl: "./manifest.json",
          worker: true,
          workerUrl: new URL("./does-not-exist.js", location.href),
        });
        return rejectionOf(client.ready());
      };

      window.__csfTestWorkerManifestValidation = async (manifestUrl) => {
        const client = new SearchClient({
          indexUrl: manifestUrl,
          worker: true,
          workerUrl: new URL("./worker.js", location.href),
        });
        return rejectionOf(client.ready());
      };

      window.__csfTestWorkerManifestValidationWithUrl = async (workerUrl) => {
        const client = new SearchClient({
          indexUrl: "./manifest.json",
          worker: true,
          workerUrl: new URL(workerUrl, location.href),
        });
        return rejectionOf(client.ready());
      };

      window.__csfTestErrorParity = async (manifestUrl) => {
        const direct = new SearchClient({
          indexUrl: manifestUrl,
          worker: false,
        });
        const worker = new SearchClient({
          indexUrl: manifestUrl,
          worker: true,
          workerUrl: new URL("./worker.js", location.href),
        });
        const capture = async (promise) => {
          try {
            await promise;
            return undefined;
          } catch (err) {
            return {
              name: err?.name,
              message: err?.message,
              isInvalidManifest: err instanceof InvalidManifestError,
              isVectorNotConfigured:
                err instanceof VectorSearchNotConfiguredError,
              isVectorMismatch: err instanceof VectorProviderMismatchError,
            };
          }
        };
        return {
          direct: await capture(direct.ready()),
          worker: await capture(worker.ready()),
        };
      };

      // A worker-side-only domain error: searchStream() never computes a
      // query embedding on the main thread, so with mode "vector" the
      // VectorSearchNotConfiguredError arises *inside* the Worker (direct
      // mode raises the same error from search.ts) -- the case that proves
      // the protocol round-trips the exported error class.
      window.__csfTestVectorErrorParity = async (useWorker) => {
        const client = new SearchClient({
          indexUrl: "./manifest.json",
          worker: useWorker,
          workerUrl: useWorker
            ? new URL("./worker.js", location.href)
            : undefined,
        });
        try {
          await client.ready();
          await client.searchStream("widgets", { mode: "vector" });
          return undefined;
        } catch (err) {
          return {
            name: err?.name,
            message: err?.message,
            isVectorNotConfigured: err instanceof VectorSearchNotConfiguredError,
          };
        }
      };

      window.__csfRunSearchStream = async (query, useWorker, opts) => {
        const client = new SearchClient({
          indexUrl: "./manifest.json",
          worker: useWorker,
          workerUrl: useWorker ? new URL("./worker.js", location.href) : undefined,
        });
        const partials = [];
        const final = await client.searchStream(query, {
          ...opts,
          onPartial: (partial) => partials.push(partial.hits.map((h) => h.id)),
        });
        return { partials, final: final.hits.map((h) => h.id) };
      };

      window.__csfRunVectorSearch = async (query, useWorker, options) => {
        const CONCEPT_BUCKETS = [
          ["cancel", "closing", "close"],
          ["plan", "account", "subscription", "membership"],
          ["widgets", "gadgets"],
          ["support"],
        ];
        const embed = (text) => {
          const words = text.toLowerCase().split(/\W+/).filter(Boolean);
          const vector = CONCEPT_BUCKETS.map(() => 0);
          for (const word of words) {
            CONCEPT_BUCKETS.forEach((bucket, i) => {
              if (bucket.includes(word)) vector[i]++;
            });
          }
          return vector;
        };
        const client = new SearchClient({
          indexUrl: "./manifest.json",
          worker: useWorker,
          workerUrl: useWorker ? new URL("./worker.js", location.href) : undefined,
          embedQuery: embed,
        });
        return client.search(query, options);
      };

      window.__csfRunVectorSearchWithProvider = async (
        query,
        useWorker,
        options,
        provider,
        validateVectorProvider,
      ) => {
        const CONCEPT_BUCKETS = [
          ["cancel", "closing", "close"],
          ["plan", "account", "subscription", "membership"],
          ["widgets", "gadgets"],
          ["support"],
        ];
        const embed = (text) => {
          const words = text.toLowerCase().split(/\W+/).filter(Boolean);
          const vector = CONCEPT_BUCKETS.map(() => 0);
          for (const word of words) {
            CONCEPT_BUCKETS.forEach((bucket, i) => {
              if (bucket.includes(word)) vector[i]++;
            });
          }
          return vector;
        };
        const client = new SearchClient({
          indexUrl: "./manifest.json",
          worker: useWorker,
          workerUrl: useWorker ? new URL("./worker.js", location.href) : undefined,
          embedQuery: { embed, provider },
          validateVectorProvider,
        });
        try {
          const result = await client.search(query, options);
          return { ok: true, result };
        } catch (err) {
          return { ok: false, name: err?.name, message: err?.message };
        }
      };

      window.__csfTestAbortSearch = async (useWorker) => {
        const client = new SearchClient({
          indexUrl: "./manifest.json",
          worker: useWorker,
          workerUrl: useWorker ? new URL("./worker.js", location.href) : undefined,
        });
        await client.ready();
        const controller = new AbortController();
        const pending = client.search("widgets", { signal: controller.signal });
        controller.abort();
        try {
          await pending;
          return undefined;
        } catch (err) {
          return err?.name;
        }
      };

      window.__csfTestAbortedBeforeSearch = async (useWorker) => {
        const client = new SearchClient({
          indexUrl: "./manifest.json",
          worker: useWorker,
          workerUrl: useWorker
            ? new URL("./worker.js", location.href)
            : undefined,
        });
        // Rejecting before ever awaiting readiness leaves the
        // constructor's own eager init/manifest promise unobserved by
        // this test -- attach a no-op handler so it can't surface as an
        // unrelated unhandled rejection.
        client.ready().catch(() => {});
        const controller = new AbortController();
        controller.abort();
        try {
          await client.search("widgets", { signal: controller.signal });
          return undefined;
        } catch (err) {
          return err?.name;
        }
      };

      // A synchronous 'query' listener aborts the signal before any work
      // starts -- raceAbort() must honor the already-aborted state or this
      // query would resolve (and even emit 'result') to a caller who
      // already aborted.
      window.__csfTestAbortInQueryListener = async (useWorker) => {
        const client = new SearchClient({
          indexUrl: "./manifest.json",
          worker: useWorker,
          workerUrl: useWorker
            ? new URL("./worker.js", location.href)
            : undefined,
        });
        await client.ready();
        const controller = new AbortController();
        client.on("query", () => controller.abort());
        try {
          await client.search("widgets", { signal: controller.signal });
          return undefined;
        } catch (err) {
          return err?.name;
        }
      };

      // A listener mutating the options object it receives must not change
      // the query that actually executes: mutating `filters` to a facet the
      // widgets docs don't belong to (and boosts to favor body) would zero
      // out or re-rank the hits if the mutation leaked into execution.
      // The corpus here gives doc 1 a boosted title, so untouched results
      // are [1, 2].
      window.__csfTestListenerMutatesOptionsParity = async (useWorker) => {
        const run = async (mutate) => {
          const client = new SearchClient({
            indexUrl: "./manifest.json",
            worker: useWorker,
            workerUrl: useWorker
              ? new URL("./worker.js", location.href)
              : undefined,
          });
          await client.ready();
          if (mutate) {
            client.on("query", ({ options }) => {
              options.filters = { category: "company" };
              if (options.boosts) {
                options.boosts.fields = { title: 0.001, body: 100 };
              } else {
                options.boosts = { fields: { title: 0.001, body: 100 } };
              }
            });
          }
          const result = await client.search("widgets", {
            limit: 10,
            boosts: { fields: { title: 1, body: 1 } },
          });
          return result.hits.map((h) => h.id);
        };
        return { mutated: await run(true), untouched: await run(false) };
      };

      // Aborts while the client is still initializing (worker init pending,
      // or the direct-mode manifest fetch in flight). ready() stays live in
      // the background; only this caller's wait is cancelled.
      window.__csfTestAbortDuringInit = async (useWorker) => {
        const client = new SearchClient({
          indexUrl: "./manifest.json",
          worker: useWorker,
          workerUrl: useWorker
            ? new URL("./worker.js", location.href)
            : undefined,
        });
        client.ready().catch(() => {});
        const controller = new AbortController();
        const pending = client.search("widgets", { signal: controller.signal });
        controller.abort();
        try {
          await pending;
          return undefined;
        } catch (err) {
          return err?.name;
        }
      };

      // Aborts once the (already resolved) query embedding has started but
      // not finished -- the caller must stop waiting on the embedding
      // without cancelling it.
      window.__csfTestAbortDuringEmbedding = async (useWorker) => {
        window.__csfEmbedStarted = false;
        const client = new SearchClient({
          indexUrl: "./manifest.json",
          worker: useWorker,
          workerUrl: useWorker
            ? new URL("./worker.js", location.href)
            : undefined,
          embedQuery: () => {
            window.__csfEmbedStarted = true;
            return new Promise(() => {});
          },
        });
        await client.ready();
        const controller = new AbortController();
        const pending = client.search("widgets", {
          mode: "vector",
          signal: controller.signal,
        });
        // Deterministic microtask spin (no timers): lets search() reach the
        // embedding await before the abort, so the abort tests the
        // embedding race rather than the readiness race.
        for (let i = 0; i < 20; i++) await Promise.resolve();
        if (!window.__csfEmbedStarted) return "embed-not-started";
        controller.abort();
        try {
          await pending;
          return undefined;
        } catch (err) {
          return err?.name;
        }
      };

      // Filter values can be mutable arrays or range objects; a listener
      // mutating the *received* options must not change what executes. The
      // corpus here: doc 3 is the only "company" doc and never mentions
      // "widgets", so with category ["company"] the query legitimately
      // matches nothing -- a leaked mutation makes widgets visible.
      window.__csfTestNestedFilterMutationParity = async (useWorker) => {
        const run = async (mutate) => {
          const client = new SearchClient({
            indexUrl: "./manifest.json",
            worker: useWorker,
            workerUrl: useWorker
              ? new URL("./worker.js", location.href)
              : undefined,
          });
          await client.ready();
          if (mutate) {
            client.on("query", ({ options }) => {
              options.filters.category.push("electronics");
              delete options.filters.brand;
            });
          }
          const result = await client.search("widgets", {
            filters: { category: ["company"], brand: "acme" },
          });
          return result.hits.map((h) => h.id);
        };
        return { mutated: await run(true), untouched: await run(false) };
      };

      // Deep-nested mutations on the listener's options copy must not show
      // up on the 'result' event either -- the result reports the original
      // effective options, not what a listener tried to tweak.
      window.__csfTestResultEventKeepsEffectiveOptions = async (useWorker) => {
        const client = new SearchClient({
          indexUrl: "./manifest.json",
          worker: useWorker,
          workerUrl: useWorker
            ? new URL("./worker.js", location.href)
            : undefined,
        });
        await client.ready();
        let resultEventOptions;
        client.on("query", ({ options }) => {
          options.filters.category.push("electronics");
          options.filters.price.min = 999;
          if (options.boosts) options.boosts.fields.body = 999;
          if (!options.boosts) options.boosts = { fields: { body: 999 } };
          options.facets.push("injected");
        });
        client.on("result", ({ options }) => {
          resultEventOptions = options;
        });
        const result = await client.search("widgets", {
          filters: { category: ["company"], price: { min: 5 } },
          boosts: { fields: { title: 1, body: 1 } },
          facets: ["category"],
        });
        return { hits: result.hits.map((h) => h.id), resultEventOptions };
      };

      // The 'query' event fires synchronously inside search(), but an
      // abort issued right after the call returns (before any microtask
      // runs) is caught by #assertUsable()'s post-ready re-check and the
      // 'query' event never fires at all. To deterministically land the
      // abort *after* the 'query' event for both worker and direct modes,
      // the query listener itself aborts synchronously -- the executing
      // query must then reject (raceAbort's aborted-first check) and never
      // emit 'result', even though the underlying worker computation is
      // still running.
      window.__csfTestNoResultEventAfterAbort = async (useWorker) => {
        const client = new SearchClient({
          indexUrl: "./manifest.json",
          worker: useWorker,
          workerUrl: useWorker
            ? new URL("./worker.js", location.href)
            : undefined,
        });
        await client.ready();
        const events = [];
        const controller = new AbortController();
        client.on("query", () => {
          events.push("query");
          controller.abort();
        });
        client.on("result", () => events.push("result"));
        const pending = client.search("widgets", { signal: controller.signal });
        await pending.catch(() => {});
        return events;
      };

      // Both helpers pass their arguments straight through to
      // registerOfflineCaching() -- deliberately resolved by the public
      // API itself, exactly as a consuming page would call it, so the
      // relative `swUrl`/`indexUrl` tests exercise the documented usage
      // rather than a pre-normalized one.
      window.__csfRegisterOffline = async (swPath, indexUrl, opts) => {
        await registerOfflineCaching(swPath, indexUrl, opts);
        await navigator.serviceWorker.ready;
      };

      // Unlike __csfRegisterOffline above, this doesn't await
      // navigator.serviceWorker.ready -- that never resolves if install
      // fails (the worker never reaches "activated"), which is exactly
      // the case an invalid/cross-origin-shard manifest is meant to
      // test. Instead it watches the installing worker's own
      // statechange events and resolves with its terminal state:
      // "activated" (install + precache succeeded) or "redundant"
      // (install failed, e.g. validateManifest() threw).
      window.__csfRegisterOfflineTrackInstall = async (
        swPath,
        indexUrl,
        opts,
      ) => {
        const registration = await registerOfflineCaching(
          swPath,
          indexUrl,
          opts,
        );
        const worker =
          registration.installing ||
          registration.waiting ||
          registration.active;
        if (!worker) return "no-worker";
        if (worker.state === "activated" || worker.state === "redundant") {
          return worker.state;
        }
        return new Promise((resolve) => {
          worker.addEventListener("statechange", function onChange() {
            if (worker.state === "activated" || worker.state === "redundant") {
              worker.removeEventListener("statechange", onChange);
              resolve(worker.state);
            }
          });
        });
      };

      window.__csfOfflineCacheUrls = async () => {
        const cache = await caches.open("searchable-offline");
        const keys = await cache.keys();
        return keys.map((r) => r.url);
      };

      window.__csfRegisterOfflineWithScope = async (swPath, indexUrl, opts) => {
        const registration = await registerOfflineCaching(
          swPath,
          indexUrl,
          opts,
        );
        await navigator.serviceWorker.ready;
        return registration.scope;
      };

      window.__csfCacheNames = async () => (await caches.keys()).sort();

      window.__csfCacheEntryStatus = async (cacheName, url) => {
        const cache = await caches.open(cacheName);
        const match = await cache.match(url);
        return match ? match.status : undefined;
      };

      window.__csfSeedCache = async (cacheName, url, status, body) => {
        const cache = await caches.open(cacheName);
        await cache.put(url, new Response(body ?? "junk", { status }));
      };

      window.__csfManifestTermShardFiles = async (indexUrl) => {
        const absIndexUrl = new URL(indexUrl, location.href).href;
        const res = await fetch(absIndexUrl);
        const manifest = await res.json();
        const map = {};
        for (const entry of manifest.shards.terms) {
          map[entry.lang] = new URL(entry.file, absIndexUrl).href;
        }
        return map;
      };

      window.__csfManifestFuzzyShardFiles = async (indexUrl) => {
        const absIndexUrl = new URL(indexUrl, location.href).href;
        const res = await fetch(absIndexUrl);
        const manifest = await res.json();
        const map = {};
        for (const [lang, descriptor] of Object.entries(manifest.fuzzy ?? {})) {
          map[lang] = new URL(descriptor.file, absIndexUrl).href;
        }
        return map;
      };

      window.__csfManifestVectorShardFiles = async (indexUrl) => {
        const absIndexUrl = new URL(indexUrl, location.href).href;
        const res = await fetch(absIndexUrl);
        const manifest = await res.json();
        const map = {};
        for (const [lang, file] of Object.entries(manifest.vectors?.shards ?? {})) {
          map[lang] = new URL(file, absIndexUrl).href;
        }
        return map;
      };

      window.__csfFetchStatus = async (url) => {
        try {
          const res = await fetch(url);
          return res.status;
        } catch {
          return "network-error";
        }
      };

      window.__csfHarnessReady = true;
    </script>
  </body>
</html>
