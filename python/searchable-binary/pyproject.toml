[project]
name = "searchable-binary"
version = "1.4.0"
description = "Shared binary shard codec (encode + decode) for Searchable, used by both the Python indexer (writer) and the Python client (reader) so a format change is a single edit per language."
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/searchable_binary"]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.8.0", "mypy>=1.13.0"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
