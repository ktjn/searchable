[project]
name = "searchable-indexer"
version = "1.4.1"
description = "Reference index builder for Searchable (Python port of the lexical-core subset of @ktjn/searchable-indexer)."
requires-python = ">=3.10"
dependencies = [
    "searchable-analysis",
    "searchable-binary",
    "selectolax>=0.3.21",
]

[project.scripts]
searchable-indexer = "searchable_indexer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/searchable_indexer"]

[tool.uv.sources]
searchable-analysis = { path = "../searchable-analysis", editable = true }
searchable-binary = { path = "../searchable-binary", editable = true }

[dependency-groups]
dev = ["pytest>=8.0.0", "jsonschema>=4.23.0", "ruff>=0.8.0", "mypy>=1.13.0"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
