[project]
name = "searchable-client"
version = "0.2.0"
description = "Dependency-light Python search client for Searchable with lexical, vector and hybrid query support."
requires-python = ">=3.10"
dependencies = [
    "searchable-analysis",
]

[project.scripts]
searchable-client = "searchable_client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/searchable_client"]

[tool.uv.sources]
searchable-analysis = { path = "../searchable-analysis", editable = true }

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.8.0", "mypy>=1.13.0"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
