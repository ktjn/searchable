# yaml-language-server: $schema=../system-spec/reference-implementation/schema.json
system:
  id: searchable
  version: "0.1.0"
  status: verified
  layers:
    - runtime
    - build
  external_sources: []

capabilities:
  - id: analyze-text
    version: "0.1"
    status: verified
    preconditions:
      - a language profile for the target language has been resolved
    postconditions:
      - returns tokens in original text order; non-word spans and stopwords
        are dropped; each token's term is normalized (NFKC, lowercased,
        optionally diacritic-folded and stemmed) per the language profile
    invariants:
      - tokenizing the same text with the same language profile is
        deterministic
    failure_modes:
      - unsupported-language
    interface:
      operation: "analyze(text, profile) -> tokens"
      mode: sync
      idempotent: true
      auth: none
      errors:
        unsupported-language: raised by language-profile lookup, not analyze() itself

  - id: build-index
    version: "0.1"
    status: verified
    preconditions:
      - caller supplies source documents and field/indexing configuration
    postconditions:
      - produces an index manifest referencing term, doc-store, facet,
        synonym, pins and fuzzy shards covering every supplied document
    invariants:
      - building from identical documents and configuration is deterministic
    failure_modes:
      - invalid-config

  - id: query-index
    version: "0.1"
    status: verified
    preconditions:
      - caller supplies a fetched, valid manifest and a query string/options
    postconditions:
      - returns ranked hits and, when requested, facet counts and
        highlighted excerpts, scoped to the fetched manifest/shards
    invariants:
      - scoring is deterministic for identical manifest, shards and query
    failure_modes:
      - invalid-manifest

components:
  - id: python-analysis
    version: "0.1.0"
    status: verified
    layer: build
    source_paths:
      - python/searchable/src/searchable/analysis
    provides:
      - analyze-text

  - id: python-indexer
    version: "0.1.0"
    status: verified
    layer: build
    source_paths:
      - python/searchable/src/searchable/indexer
    provides:
      - build-index
    requires:
      - analyze-text@^0.1
    context_budget:
      max_owns_data: 7
    owns_data:
      - index-manifest
      - term-shard
      - doc-store-shard
      - facet-shard
      - synonym-shard
      - pins-shard
      - fuzzy-shard

  - id: python-client
    version: "0.1.0"
    status: verified
    layer: runtime
    source_paths:
      - python/searchable/src/searchable/client
    provides:
      - query-index
    requires:
      - analyze-text@^0.1

  - id: ts-client
    version: "0.1.0"
    status: verified
    layer: runtime
    source_paths:
      - packages/searchable/src
    provides:
      - query-index

data_models:
  - id: index-manifest
    version: "0.1.0"
    owner: python-indexer
    classification: public
    schema_path: spec/schema/manifest.schema.json
    fields:
      version: integer, format version
      buildId: string, build identity
      languages: array of analyzed language codes
      defaultLanguage: string
      fields: field name -> indexing config
      facetFields: array of facet field names
      docCount: integer
      avgFieldLength: object, field name -> average length
      shards: array of shard references (term/doc-store/facet/synonym/pins/fuzzy)
      synonyms: optional synonym-shard reference
      pins: optional pins-shard reference
      fuzzy: optional fuzzy-shard reference
      vectors: optional vector index reference

  - id: term-shard
    version: "0.1.0"
    owner: python-indexer
    classification: public
    derived_from: [index-manifest]
    schema_path: spec/schema/term-shard.schema.json
    fields:
      postings: term -> document postings (inverted index)

  - id: doc-store-shard
    version: "0.1.0"
    owner: python-indexer
    classification: restricted
    classification_review: classify-stored-document-fields
    derived_from: [index-manifest]
    schema_path: spec/schema/doc-store-shard.schema.json
    fields:
      documents: stored source-document field values, keyed by document id

  - id: facet-shard
    version: "0.1.0"
    owner: python-indexer
    classification: public
    derived_from: [index-manifest]
    schema_path: spec/schema/facet-shard.schema.json
    fields:
      type: facet kind (terms/range/hierarchical)
      separator: hierarchy path separator
      values: facet value -> document postings
      sorted: sorted value index (range facets)
      points: geo point index

  - id: synonym-shard
    version: "0.1.0"
    owner: python-indexer
    classification: public
    derived_from: [index-manifest]
    schema_path: spec/schema/synonym-shard.schema.json
    fields:
      equivalences: term equivalence classes
      directional: one-way expansions
      multiWord: multi-word synonym phrases

  - id: pins-shard
    version: "0.1.0"
    owner: python-indexer
    classification: public
    derived_from: [index-manifest]
    schema_path: spec/schema/pins-shard.schema.json
    fields:
      pins: query term -> pinned document ids

  - id: fuzzy-shard
    version: "0.1.0"
    owner: python-indexer
    classification: public
    derived_from: [index-manifest]
    schema_path: spec/schema/fuzzy-shard.schema.json
    fields:
      maxEdits: maximum edit distance
      deletions: deletion-neighborhood index for fuzzy lookup

requirements:
  - id: classify-stored-document-fields
    version: "0.1.0"
    target: doc-store-shard
    status: verified
    kind: non-functional
    mandatory: false
    criteria:
      - >-
        Stored document field values (doc-store-shard) are whatever fields
        the indexing caller chooses to store; their classification depends
        on the caller's own content, not on this library. A deployment
        embedding this library must assign its own classification for the
        fields it stores before that deployment is itself onboarded at
        architecture level. Not mandatory here: this library structurally
        cannot produce that evidence itself -- it is only satisfiable by
        each downstream deployment, at its own onboarding.

  - id: req-functional-analyze
    version: "0.1.0"
    target: analyze-text
    status: verified
    kind: functional
    category: functional
    mandatory: true
    criteria:
      - analyze() tokenizes, normalizes and stems text per the resolved
        language profile, dropping stopwords and non-word spans

  - id: req-functional
    version: "0.1.0"
    target: query-index
    status: verified
    kind: functional
    category: functional
    mandatory: true
    criteria:
      - ts-client and python-client return equivalent results for every
        case in the shared client-conformance suite
      - build-index produces a manifest and shard set that python-client
        can load and query

  - id: req-semantic
    version: "0.1.0"
    target: query-index
    status: verified
    kind: functional
    category: semantic
    mandatory: true
    criteria:
      - BM25F scoring ranks a title-field match above an equivalent
        body-field match, and a rarer term above a more common one, all
        else equal

  - id: req-contract
    version: "0.1.0"
    target: query-index
    status: verified
    kind: functional
    category: contract
    mandatory: true
    criteria:
      - a structurally invalid manifest is rejected before any query runs
        against it, in both client runtimes

  - id: req-serialization
    version: "0.1.0"
    target: build-index
    status: verified
    kind: functional
    category: serialization
    mandatory: true
    criteria:
      - every shard and the manifest produced by build-index validates
        against its published JSON Schema (spec/schema/*.schema.json)

  - id: req-scalability
    version: "0.1.0"
    target: query-index
    status: verified
    kind: non-functional
    category: scalability
    mandatory: true
    criteria:
      - a query whose hits straddle a doc-store shard boundary returns
        identical results whether the store is sharded or not

  - id: req-resilience
    version: "0.1.0"
    target: query-index
    status: verified
    kind: non-functional
    category: resilience
    mandatory: true
    criteria:
      - disposing or aborting a client mid-operation rejects in-flight and
        queued work cleanly, without corrupting client state or leaving
        later calls in an inconsistent state

  - id: req-security
    version: "0.1.0"
    target: query-index
    status: verified
    kind: non-functional
    category: security
    mandatory: true
    criteria:
      - the static shard server rejects encoded path traversal outside its
        root and serves only files it discovered at startup
      - a query containing a literal Object.prototype key (e.g.
        "constructor") is handled as ordinary data in every lookup path,
        never as a prototype write or an uncontrolled crash

  - id: req-performance
    version: "0.1.0"
    target: ts-client
    status: verified
    kind: non-functional
    category: performance
    mandatory: true
    criteria:
      - the ts-client production bundle stays within its enforced gzip
        size budget

  - id: req-concurrency
    version: "0.1.0"
    target: query-index
    status: verified
    kind: functional
    category: concurrency
    mandatory: true
    criteria:
      - many concurrent query-index calls against one shared client
        instance do not corrupt shard-cache state or produce
        cross-contaminated/inconsistent results

  - id: req-observability
    version: "0.1.0"
    target: searchable
    status: verified
    kind: non-functional
    category: observability
    mandatory: true
    criteria:
      - >-
        build-index and query-index failures surface synchronously as
        typed errors (InvalidManifestError and friends) at the embedder's
        own call site, raised directly from analyze/build/validate -- this
        is the library's complete, intentional observability surface. It
        has no separate logging/metrics/tracing hooks: a synchronous,
        embedder-driven static-index client has no background operation
        an out-of-band channel would need to report on, so none was added

